name: CI

# Unit and integration tests, on every push to main and every pull request, and as the release
# gate (release.yml calls this workflow on the tagged commit). The integration tests run against a
# real hardcharger-server release and fail, never skip, without one.
#
# The Chargewire JDBC driver (pom.xml's chargewire-jdbc.version): a -SNAPSHOT is built from the
# third_party/chargewire-jdbc submodule, which must be at that version; a release comes from Maven
# Central, and the job fails if Central doesn't have it.
#
# Access, with no personal token:
#   - the third_party/chargewire-jdbc submodule (gizmodata/chargewire-jdbc, internal), for a
#     -SNAPSHOT only, through the CHARGEWIRE_JDBC_DEPLOY_KEY secret, a read-only deploy key of that
#     repository;
#   - hardcharger-server from the private image ghcr.io/gizmodata/hardcharger, pulled with this
#     workflow's GITHUB_TOKEN; the package grants this repository read access (package
#     settings, Manage Actions access).

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:
  workflow_call:
    secrets:
      CHARGEWIRE_JDBC_DEPLOY_KEY:
        required: false

permissions:
  contents: read
  packages: read

# The group names the caller's workflow (a called workflow sees the caller's github.workflow),
# so a release dispatch that calls this workflow never cancels a push run of it; "-tests" keeps
# it apart from release.yml's own group, which would otherwise deadlock with it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-tests
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # The server the integration tests run against: hardcharger's main branch, which CI publishes
  # on every green push (:main, and :sha-<short> for a fixed build). :main so the driver keeps up
  # with the server; pin a :sha- here to reproduce an old run.
  HARDCHARGER_IMAGE: ghcr.io/gizmodata/hardcharger:main
  # The last release before the protocol's rename to Chargewire: LegacyCompatibilityIT checks the
  # driver still works with it.
  HARDCHARGER_LEGACY_IMAGE: ghcr.io/gizmodata/hardcharger:2.2.0

jobs:
  test:
    name: Unit and integration tests (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        jdk: [17, 21]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Where the Chargewire JDBC driver comes from
        id: chargewire
        run: |
          set -euo pipefail
          version=$(sed -n 's:^    <chargewire-jdbc.version>\(.*\)</chargewire-jdbc.version>$:\1:p' pom.xml)
          [ -n "$version" ] || { echo "::error::no chargewire-jdbc.version in pom.xml"; exit 1; }
          case "$version" in
            *-SNAPSHOT) from=submodule ;;
            *) from=central ;;
          esac
          echo "chargewire-jdbc $version from $from"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "from=$from" >> "$GITHUB_OUTPUT"

      - name: Check Maven Central has the Chargewire JDBC driver
        if: steps.chargewire.outputs.from == 'central'
        env:
          VERSION: ${{ steps.chargewire.outputs.version }}
        run: |
          set -euo pipefail
          url="https://repo1.maven.org/maven2/com/gizmodata/chargewire-jdbc/$VERSION/chargewire-jdbc-$VERSION.pom"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 "$url")
          [ "$code" = 200 ] || { echo "::error::com.gizmodata:chargewire-jdbc:$VERSION is not on Maven Central (HTTP $code): release it first, or name a -SNAPSHOT built from the submodule"; exit 1; }

      # The submodule over SSH with chargewire-jdbc's read-only deploy key.
      - name: Fetch the chargewire-jdbc submodule
        if: steps.chargewire.outputs.from == 'submodule'
        env:
          DEPLOY_KEY: ${{ secrets.CHARGEWIRE_JDBC_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::the CHARGEWIRE_JDBC_DEPLOY_KEY secret is not set: the private key of a read-only deploy key of gizmodata/chargewire-jdbc"
            exit 1
          fi
          key="$RUNNER_TEMP/chargewire_jdbc_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          git -c url."ssh://git@github.com/gizmodata/chargewire-jdbc".insteadOf=https://github.com/gizmodata/chargewire-jdbc \
            -c core.sshCommand="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            submodule update --init --depth 1
          rm -f "$key"
          git -C third_party/chargewire-jdbc log -1 --format='chargewire-jdbc at %H %s'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven

      - name: Install the Chargewire JDBC driver from the submodule
        if: steps.chargewire.outputs.from == 'submodule'
        env:
          VERSION: ${{ steps.chargewire.outputs.version }}
        run: |
          set -euo pipefail
          have=$(sed -n 's:^  <version>\(.*\)</version>$:\1:p' third_party/chargewire-jdbc/pom.xml | head -1)
          [ "$have" = "$VERSION" ] || { echo "::error::pom.xml wants chargewire-jdbc $VERSION, the submodule is $have: repin it or change chargewire-jdbc.version"; exit 1; }
          mvn -B -ntp -f third_party/chargewire-jdbc/pom.xml -DskipTests -DskipITs install

      - uses: ./.github/actions/hardcharger-server
        with:
          image: ${{ env.HARDCHARGER_IMAGE }}
          token: ${{ github.token }}

      # Plain HTTP on 127.0.0.1:41337 with a fresh administrator password; it answers 404 at
      # /chargewire, its discovery being under the former root.
      - name: Start a Hardcharger server from before the rename
        env:
          IMAGE: ${{ env.HARDCHARGER_LEGACY_IMAGE }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          password=$(openssl rand -hex 16)
          echo "::add-mask::$password"
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          if ! docker pull -q "$IMAGE"; then
            echo "::error::can't pull $IMAGE with this workflow's GITHUB_TOKEN"
            exit 1
          fi
          docker logout ghcr.io >/dev/null
          HARDCHARGER_ADMIN_PASSWORD=$password docker run -d --name hardcharger-legacy \
            -p 127.0.0.1:41337:31337 -e HARDCHARGER_ADMIN_PASSWORD "$IMAGE" >/dev/null
          code=
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:41337/chargewire || true)
            [ "$code" = 404 ] && break
            sleep 1
          done
          if [ "$code" != 404 ]; then
            docker logs hardcharger-legacy 2>&1 | tail -50
            echo "::error::$IMAGE did not answer on 127.0.0.1:41337 (HTTP '$code' at /chargewire)"
            exit 1
          fi
          echo "HARDCHARGER_JDBC_TEST_LEGACY_SERVER=127.0.0.1:41337" >> "$GITHUB_ENV"
          echo "HARDCHARGER_JDBC_TEST_LEGACY_SERVER_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Unit and integration tests
        run: mvn -B -ntp verify

      - name: Check formatting and Javadoc
        if: matrix.jdk == 17
        run: mvn -B -ntp spotless:check javadoc:javadoc -Ddoclint=all

      - name: Check the standalone jar is self-contained
        if: matrix.jdk == 17
        run: |
          set -euo pipefail
          jar tf target/hardcharger-jdbc.jar > entries.txt
          unzip -p target/hardcharger-jdbc.jar META-INF/services/java.sql.Driver > drivers.txt
          grep -qx 'com.gizmodata.hardcharger.jdbc.HardchargerDriver' drivers.txt
          grep -qx 'com.gizmodata.chargewire.jdbc.ChargewireDriver' drivers.txt
          # Every dependency is relocated except zstd-jni, whose JNI symbols name its package.
          if grep -E '^(org|com/fasterxml|com/google)/' entries.txt; then
            echo "::error::unrelocated classes in the standalone jar"
            exit 1
          fi

      - name: Server log of a failed run
        if: failure()
        run: |
          find /tmp -name server.log -path '*hardcharger-jdbc-server*' -exec tail -50 {} \; || true
          docker logs hardcharger-legacy 2>&1 | tail -50 || true

      - uses: actions/upload-artifact@v7
        if: matrix.jdk == 17
        with:
          name: hardcharger-jdbc
          path: |
            target/hardcharger-jdbc.jar
            target/hardcharger-jdbc-*.jar
